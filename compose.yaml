services:
  wechat-runtime:
    image: ghcr.io/yamada-sexta/matrix-wechat-runtime:master
    build:
      context: .
      dockerfile: packages/wechat-runtime/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE, SYS_CHROOT]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    volumes:
      - ./data/wechat:/home/wechat:Z
    ports:
      - "127.0.0.1:18742:18742"
    expose: ["18743"]
    environment:
      TZ: UTC
      WECHAT_API_TOKEN: ${WECHAT_API_TOKEN:?Set WECHAT_API_TOKEN in .env}
      WECHAT_WEB_UI: ${WECHAT_WEB_UI:-true}
      WECHAT_AUTO_LOGIN: "false"
  bridge:
    image: ghcr.io/yamada-sexta/matrix-wechat:master
    build:
      context: .
      dockerfile: packages/matrix-bridge/Dockerfile
    restart: unless-stopped
    depends_on: [wechat-runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data/bridge:/data:Z
    ports:
      - "127.0.0.1:17778:17778"
    environment:
      TZ: UTC
      WECHAT_API_TOKEN: ${WECHAT_API_TOKEN:?Set WECHAT_API_TOKEN in .env}
