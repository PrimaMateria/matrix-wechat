# One WeChat account and one Matrix owner per deployment.
homeserver:
  address: http://synapse:8008
  domain: example.com
appservice:
  address: http://bridge:17778
  hostname: 0.0.0.0
  port: 17778
  bot_username: wechatbot
  registration: /data/registration.yaml
bridge:
  owner: '@you:example.com'
  command_prefix: '!wechat'
database:
  path: /data/matrix-wechat.db
network:
  backend: native
  # For development: backend: fake
  fixture: /opt/matrix-wechat/fixtures/demo.json
