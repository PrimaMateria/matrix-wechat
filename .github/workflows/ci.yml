name: Bridge and runtime CI and container release
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: matrix-bridge
            suffix: ''
          - package: wechat-runtime
            suffix: '-runtime'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern=latest,enable=${{ !contains(github.ref_name, '-') && startsWith(github.ref, 'refs/tags/') }}
      - name: Build and cache verification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: packages/${{ matrix.package }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: matrix-wechat-${{ matrix.package }}:check
          cache-from: type=gha,version=2,scope=${{ matrix.package }}-amd64
          cache-to: type=gha,version=2,mode=max,scope=${{ matrix.package }}-amd64,timeout=5m,ignore-error=true
      - name: Verify bridge CLI
        if: matrix.package == 'matrix-bridge'
        run: |
          docker run --rm --network none matrix-wechat-matrix-bridge:check --version
          docker run --rm --network none matrix-wechat-matrix-bridge:check -e -c /tmp/config.yaml
      - name: Verify bundled native client without launching WeChat
        if: matrix.package == 'wechat-runtime'
        run: |
          docker run --rm --network none --entrypoint bun matrix-wechat-wechat-runtime:check -e '
            import {Runtime} from "/opt/matrix-wechat/packages/wechat-runtime/src/runtime.ts";
            const executable = await new Runtime().executable();
            if (!executable.startsWith("/opt/wechat-client/app/")) throw Error("Client is not bundled");
            if (Bun.spawnSync(["test", "-w", executable]).exitCode === 0) throw Error("Client is writable");
            console.log("Pinned, read-only client verified");
          '
      - name: Publish verified image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: github.event_name == 'push'
        with:
          context: .
          file: packages/${{ matrix.package }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=${{ matrix.package }}-amd64
